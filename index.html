<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button class="btn">Calender</button>
        <button class="btn">Chart</button>
        <button class="btn">Chronometer</button>
    </header>

    <section>
        <h1>Calender</h1>
        <div class="calender-container">
            <div class="calender">
                <div class="calender-header">
                    <button class="btn">‹</button>
                    <h2>September 2026</h2>
                    <button class="btn">›</button>
                </div>

                <div class="week-days text">
                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                </div>

                <div class="days"></div>
            </div>

            <div class="tasks-container">
                <div class="tasks">
                    <div class="tasks-header">
                        <p class="text">Friday, 19 september</p>
                        <p class="text">8h 55min registred</p>
                        <button>+ Add</button>
                    </div>
                    <div class="registred-tasks">
                        <p class="text">exemplo</p>
                    </div>
                </div>
            </div>

        </div>
    </section>


    <script src="script.js"></script>
</body>
</html>
