<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
    <div class="header-btn-container">
            <button class="btn header-btn bi bi-calendar"></button>
            <button class="btn header-btn bi bi-pie-chart-fill"></button>
            <button class="btn header-btn bi bi-clock"></button>
        </div>
    </header>

    <section class="calendar-section section">
        <h1>Calendar</h1>
        <div class="calendar-container container">
            <div class="calendar">
                <div class="calendar-header">
                    <button class="calender-header-btn bi bi-caret-left-fill"></button>
                    <h2></h2>
                    <button class="calender-header-btn bi bi-caret-right-fill"></button>
                </div>

                <div class="week-days text">
                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                </div>

                <div class="days"></div>
            </div>

            <div class="tasks-container">
                <div class="tasks">
                    <div class="tasks-top">
                        <div class="tasks-header">
                            <p class="text"></p>
                            <p class="text">6h 21min registred</p>
                        </div>

                        <div class="tasks-header-btn">
                            <button onclick="showAddTaks()" class="btn tasksbtn">+ Add</button>
                        </div>
                    </div>

                    <div class="registred-tasks">
                        
                    </div>

                    <div class="add-task-overlay hide">
                        <div class="add-task-box">
                            <button onclick="showAddTaks()" class="bi bi-x-lg"></button>
                            <div class="input-buttons-container">
                                <input id="activity-name-input" class="text input add-task-input" type="text" placeholder="Current activity name">
                                <div class="time-dropdown-container">
                                    <input id="hours-input" class="text input add-task-input-time" type="number" placeholder="Hours" >
                                    <input id="minutes-input" class="text input add-task-input-time" type="number" placeholder="Minutes" >
                                    <details>
                                        <summary class="dropdown-btn text">Studying</summary>
                                        <div class="content">
                                            <button class="text">Working</button>
                                            <button class="text">Leisure</button>
                                            <button class="text">Workout</button>
                                        </div>
                                    </details>                                    
                                </div>  
                            </div>

                            

                            <div class="action-buttons-container">
                                <button onclick="saveActivity()" class="btn action-buttons save">Save</button>
                                <button class="btn action-buttons">Cancel</button>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="chart-section section hide">
        <h1>Chart</h1>
        <div class="chart-container container">
            <div class="pie-chart-container">
                <h1>6h 21min</h1>
                <figure>
                    <div class="pie"></div>
                </figure>
            </div>
            
        </div>
    </section>

    <section class="chronometer-section section hide">
        <h1>Chronometer</h1>
        <div class="chronometer-container container">
            <div class="chronometer-div">
                <p class="text">00:00:00:00</p>
            </div>
            <div class="chronometer-div-input">
                <input class="text input chronometer-input" type="text" placeholder="current activity">
            </div>
            <div class="chronometer-div-btn">
                <button onclick="start()" class="bi bi-play-fill chronometer-btn"></button>
                <button onclick="clear()" class="bi bi-arrow-clockwise chronometer-btn"></button>             
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
