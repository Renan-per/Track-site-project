<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
    <div class="header-btn-container">
            <button onclick="switchSection()" class="btn header-btn bi bi-calendar"></button>
            <button onclick="switchSection()" class="btn header-btn bi bi-pie-chart-fill"></button>
            <button onclick="switchSection()" class="btn header-btn bi bi-clock"></button>
        </div>
    </header>

    <section class="calendar-section section">
        <h1>Calendar</h1>
        <div class="calendar-container">
            <div class="calendar">
                <div class="calendar-header">
                    <button class="calender-header-btn bi bi-caret-left-fill"></button>
                    <h2></h2>
                    <button class="calender-header-btn bi bi-caret-right-fill"></button>
                </div>

                <div class="week-days text">
                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                </div>

                <div class="days"></div>
            </div>

            <div class="tasks-container">
                <div class="tasks">
                    <div class="tasks-top">
                        <div class="tasks-header">
                            <p class="text">Friday, 19 september</p>
                            <p class="text">8h 55min registred</p>
                        </div>

                        <div class="tasks-header-btn">
                            <button class="btn tasksbtn">+ Add</button>
                        </div>
                    </div>

                    <div class="registred-tasks">
                        <p class="text">exemplo</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="chart-section section hide">
        <h1>Chart</h1>
        <div class="chart-container">
            <div class="chart-div"></div>
        </div>
    </section>

    <section class="chronometer-section section hide">
        <h1>Chronometer</h1>
        <div class="chronometer-container">
            <div class="chronometer-div">
                <p class="text">00:00:00.00</p>
            </div>
            <div class="chronometer-div-input">
                <input class="text chronometer-input" type="text" placeholder="Type the current activity">
            </div>
            <div class="chronometer-div-btn">
                <button class="bi bi-play-fill"></button>
                <button class="bi bi-arrow-clockwise"></button>             
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
